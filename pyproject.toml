[project]
name = "chat-record-analyzer"
version = "0.1.0"
description = "Standalone Streamlit POC for AI intervention decisions on WeCom group chat archives."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
chat-record-analyzer = "chat_record_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
